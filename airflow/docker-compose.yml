services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    build: .
    image: rag-airflow:local
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
      MONITOR_URL: ${MONITOR_URL:-http://host.docker.internal:8000}
      CHUNKING_URL: ${CHUNKING_URL:-http://host.docker.internal:8001}
      EMBEDDING_URL: ${EMBEDDING_URL:-http://host.docker.internal:8002}
      VECTOR_INGESTION_URL: ${VECTOR_INGESTION_URL:-http://host.docker.internal:8003}
    volumes: &airflow-volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
      - ../monitoring_service/data:/data/incoming
    command: >-
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin
      --firstname Airflow --lastname Admin --role Admin
      --email admin@example.com || true"

  airflow-webserver:
    image: rag-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    image: rag-airflow:local
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    volumes: *airflow-volumes
    command: scheduler

volumes:
  postgres_data:
